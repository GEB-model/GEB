[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[project]
name = "geb-docs"
version = "0.1.0"
description = "Markdown extensions used to build the GEB documentation with Zensical."
requires-python = ">=3.14"
dependencies = [
    "markdown>=3.6",
    "pybtex>=0.25",
    "citeproc-py>=0.9",
]
