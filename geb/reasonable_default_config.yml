id: null
spinup_name: spinup
name: default
start_time: 2010-01-01
end_time: 2024-12-30
spinup_time: 1980-01-01
input_folder: input
output_folder: output
simulation_root: simulation_root
loglevel: DEBUG

forecasts:
  use: false
  provider: ECMWF
  processing: merged_control_ensemble

hazards:
  floods:
    simulate: false
    subbasins: auto
    forcing_method: accumulated_runoff
    minimum_flood_depth: 0.05
    flood_map_output_interval_seconds: null
    grid_size_multiplier: 1
    subgrid: false
    overwrite: auto
    coastal_only: false
    write_figures: false
    return_periods:
      - 2
      - 5
      - 10
      - 25
      - 50
      - 100
      - 250
      - 500
      - 1000
    flood_protection_standard:
      mode: auto
      manual_value: 10
    hydrograph_shape:
      method: triangular
      window_days: 3.5
      tolerance: 0.1
    p_value_threshold: 0.05
    selection_strategy: first_significant
    fixed_shape: 0.0
    SFINCS:
      gpu: auto
    detect_floods_from_discharge: false
    discharge_threshold: 30
    threshold_location:
      - lon
      - lat
    run_for_validation_events: false
    observation_files:
      - 20210712T090000 - 20210720T090000.zarr
    events: []
  damage:
    simulate: false

hydrology:
  simulate_forest: false
  hydrological_year_start_month: 1
  erosion:
    simulate: false
  landsurface:
    crop_factor_multiplier: 1.0
    interflow_multiplier: 1.0
    saturated_hydraulic_conductivity_multiplier: 1.0
    vertical_saturated_hydraulic_conductivity_multiplier: 1.0
    variable_runoff_shape_beta_multiplier: 1.0
  groundwater:
    hydraulic_conductivity_multiplier: 1.0
  runoff_concentrator:
    runoff_concentration_factor: 1.0
  karst:
    capture_fraction: 1.0
    release_time_days: 10.0
    vertical_conductivity_multiplier: 10.0
  routing:
    max_threads: null
    fix_river_geometry_after_spinup: true
    mannings_n_multiplier: 1.0
    bankfull_discharge_multiplier: 1.0
    lake_outflow_multiplier: 1.0
    retention_basins:
      release_threshold_factor: 0.85
      activation_threshold_return_period_years: 2
    riverbed_hydraulic_conductivity_multiplier: 0.1
    river_width:
      default_alpha: 7.2
      beta: 0.5
    river_depth:
      min_depth_m: 0.1
      shape_exponent: 0.5
      use_observed_width_as_bankfull: true

evaluation:
  discharge:
    minimum_upstream_area_km2: 0
    minimum_timeseries_length_years: 5

agents:
  government:
    plant_forest: false
    adaptation:
      enabled: false
      mode: threshold
      dike_elevation_cost_per_meter_usd: 6800
      dike_maintenance_cost_per_year_usd: 80
      EAD_threshold: 1000000
      equity_indicator_threshold: 0.5
      ecosystem_indicator_threshold: 0.5
      adaptation_fraction: 0.1
  market:
    dynamic_market: false
    price_frequency: yearly
  households:
    adapt: false
    adapt_to_actual_floods: false
    water_demand:
      method: default
    adjust_demand_factor: 1
    warning_response: false
    warning_system:
      probability_threshold: 0.6
      area_threshold: 0.1
      building_threshold: 0.1
      communication_efficiency: 0.78
      weight_by_socioeconomic_factors: false
      damage_reduction_over_leadtime: false
      evacuation_lead_time_threshold: 48
      response_rates:
        area_based_warnings: 0.35
        building_based_warnings: 0.7
      warning_target:
        residential_buildings:
          enabled: false
          warning_type: building_based
        critical_infrastructure:
          enabled: false
          get_critical_facilities: false
          asset_type:
            - energy_substations
    expected_utility:
      flood_risk_calculations:
        risk_perception:
          base: 1.6
          coef: -2.5
          max: 10
          min: 0.1
  insurers:
    duration: 1
    seut_factor: 1
    government_premium_cap: false
    traditional_insurance:
      ruleset: no-adaptation
      loading_rate: 0.3
    index_insurance:
      ruleset: no-adaptation
      loading_rate: 0.2
    pr_insurance:
      ruleset: no-adaptation
      loading_rate: 0.2
  crop_farmers:
    ruleset: no-adaptation
    base_management_yield_ratio: 1
    cultivation_cost_fraction: 0.1
    microcredit:
      ruleset: no-adaptation
      interest_rate: 0.2
      loan_duration: 2
    social_network:
      radius: 5000
      size: 10
    expected_utility:
      crop_switching:
        ruleset: no-adaptation
        loan_duration: 0
        switching_cap: 1
      adaptation_efficiency:
        ruleset: no-adaptation
        dynamic_adaptation: true
        static_price: true
        loan_duration: 21
        decision_horizon: 20
        return_fraction_surface: 0.75
        return_fraction_sprinkler: 0.3
        return_fraction_drip: 0.2
        irr_eff_surface: 0.60
        irr_eff_sprinkler: 0.75
        irr_eff_drip: 0.95
        efficiency_division: [0.5, 0.5]
      adaptation_well:
        ruleset: no-adaptation
        seut_factor: 1
        loan_duration: 21
        lifespan: 20
        decision_horizon: 20
        pump_hours: 3.5
        specific_weight_water: 9800
        max_initial_sat_thickness: 50
        pump_efficiency: 0.7
        maintenance_factor: 0.07
      decisions:
        decision_horizon: 10
        expenditure_cap: 0.5
      water_price:
        static: true
        water_costs_m3_reservoir: 0
        water_costs_m3_groundwater: 0
        water_costs_m3_channel: 0
      drought_risk_calculations:
        event_perception:
          drought_threshold: 5
        risk_perception:
          base: 1.6
          coef: -2.5
          max: 10
          min: 0.5
  fix_activation_order: true
  reservoir_operators:
    ruleset: no-adaptation
    equal_abstraction: false
    reservoir_M_factor: 0.1
    reservoir_release_factor: 0.1

report:
  _config:
    compression_level: 9
    chunk_target_size_bytes: 100000000
  _water_circle: false
  _water_balance: false
  _water_storage: false
  _energy_balance: false
  _discharge_stations: true
  _bankfull_depths: true
  _retention_basins: false
  _meteorological_stations: true
